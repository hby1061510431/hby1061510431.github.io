<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>houbingyue.me</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('https://github.com/user-attachments/assets/f194ba37-0939-4001-9b2f-f0dc28831eca');
      background-size: cover;
      background-position: center;
      filter: brightness(0.75);
      transform: scale(1.03);
      transition: transform 8s ease-out;
    }

    .hero-bg.loaded {
      transform: scale(1);
    }

    .hero-content {
      position: relative;
      text-align: center;
      color: #fff;
      padding: 2rem;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    .hero-content h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
    }

    .hero-content p {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      opacity: 0.9;
      margin-bottom: 2rem;
    }

    .hero-content a {
      display: inline-block;
      padding: 0.75rem 2rem;
      border: 2px solid #fff;
      border-radius: 2rem;
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 0.08em;
      transition: background 0.3s, color 0.3s;
    }

    .hero-content a:hover {
      background: #fff;
      color: #333;
    }

    .season-tag {
      display: inline-block;
      margin-bottom: 1.2rem;
      padding: 0.3rem 1rem;
      background: rgba(255, 160, 30, 0.75);
      border-radius: 1rem;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
    }

    footer {
      position: absolute;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-content">
      <span class="season-tag">🍂 金秋时节</span>
      <h1>houbingyue.me</h1>
      <p>欢迎来到我的个人主页</p>
      <a href="https://github.com/hby1061510431" target="_blank" rel="noopener noreferrer">GitHub 主页</a>
    </div>
    <footer>© 2026 houbingyue.me &nbsp;·&nbsp; 秋叶落，岁月长</footer>
  </section>

  <script>
    const bg = document.getElementById('heroBg');
    const img = new Image();
    img.onload = () => bg.classList.add('loaded');
    img.src = 'https://github.com/user-attachments/assets/f194ba37-0939-4001-9b2f-f0dc28831eca';
  </script>
</body>
</html>
